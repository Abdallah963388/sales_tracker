name: sales_tracker
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+7

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  fluttertoast: ^8.2.12
  dio: ^5.9.0
  go_router: ^16.2.0
  url_launcher: ^6.3.2
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.3
  flutter_localizations:
    sdk: flutter
  equatable: ^2.0.7
  flutter_easyloading: ^3.0.5
  flutter_iconly: ^1.0.2
  dartz: ^0.10.1
  verification_code: ^0.0.4
  location: ^5.0.3
  package_info_plus: ^9.0.0
  flutter_animate: ^4.5.2
  file_picker: ^8.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^11.0.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  device_info_plus: ^9.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  very_good_analysis: ^9.0.0
  pretty_dio_logger: ^1.4.0
  icons_launcher: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/


  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-Medium.ttf
        - asset: assets/fonts/Inter_18pt-Bold.ttf
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
        - asset: assets/fonts/Almarai-Regular.ttf
        - asset: assets/fonts/Almarai-Bold.ttf

icons_launcher:
  image_path: "assets/images/sit_logo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

# dart run icons_launcher:create
#flutter gen-l10n